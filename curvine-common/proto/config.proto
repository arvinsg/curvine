syntax = "proto2";
package proto;

option java_package = "io.curvine.proto";
option java_multiple_files = true;
option java_outer_classname = "ConfigProto";

// Config item for get/list response and set request payload.
message ConfigItemProto {
    required string key = 1;
    required bytes value = 2;
    required uint64 version = 3;
    required uint64 mtime = 5;  
}

// Get config by key.
message GetConfigRequest {
    required string key = 1;
}

message GetConfigResponse {
    optional ConfigItemProto item = 1;
}

// List configs by prefix.
message ListConfigRequest {
    required string prefix = 1;
    optional uint32 limit = 2;
}

message ListConfigResponse {
    repeated ConfigItemProto items = 1;
}

// Set config.
message SetConfigRequest {
    required string key = 1;
    required bytes value = 2;
}

message SetConfigResponse {
    required bool success = 1;
    required uint64 version = 2;
}

// Delete config.
message DeleteConfigRequest {
    required string key = 1;
    optional uint64 prev_version = 2;
}

message DeleteConfigResponse {
    required bool success = 1;
}
