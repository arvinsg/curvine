syntax = "proto2";
package proto;

option java_package = "io.curvine.proto";
option java_multiple_files = true;
option java_outer_classname = "PdProto";

// Get meta route summary (mode, version, path table, meta groups). Client caches by version.
message GetMetaRouteSummaryRequest {
}

message GetMetaRouteSummaryResponse {
    // Bincode-serialized MetaRouteSummary (curvine_common::state::MetaRouteSummary).
    optional bytes summary = 1;
}
